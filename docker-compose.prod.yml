# docker-compose.prod.yml — Grand Lumière (Production Override)
#
# File ini TIDAK berdiri sendiri. Dijalankan digabung dengan file developer:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Prinsip: file developer (docker-compose.yml) TIDAK diubah.
# File ini hanya menimpa/menambahkan bagian yang perlu untuk production.

version: "3.9"

services:

  php:
    restart: unless-stopped
    # Di development, source code di-bind mount (".:/app") supaya edit langsung kelihatan.
    # Di production, TIDAK boleh bind mount source code dari host.
    # Kode harus sudah "dibekukan" di dalam image saat build (docker compose build).
    # Baris di bawah menimpa volume developer supaya bind mount TIDAK aktif di production.
    volumes: []

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"           # tambahan untuk HTTPS
    volumes:
      # Nginx tetap perlu akses ke file statis (asset, gambar) -> mount read-only
      - .:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  mysql:
    restart: unless-stopped
    # Port 3306 di file developer dibuka supaya bisa diakses tool seperti DBeaver/HeidiSQL.
    # Di production, port ini WAJIB ditutup agar database tidak bisa diakses dari internet.
    ports: []

volumes:
  nginx_logs:
  certbot_www:
  certbot_certs:

