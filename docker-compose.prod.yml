# docker-compose.prod.yml — Grand Lumière (Production)
#
# Dijalankan digabung dengan file base (docker-compose.yml), TANPA docker-compose.override.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Resource limit disesuaikan untuk server: 2 core CPU, ~6.9 GB RAM.
# Total teralokasikan ke container: 2 core CPU, ~3.75 GB RAM.
# Sisanya sengaja disisakan untuk OS dan buffer lonjakan traffic.

services:
  php:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.75
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    restart: unless-stopped
    mem_limit: 2.5g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_logs:
  certbot_www:
  certbot_certs: