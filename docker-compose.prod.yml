# docker-compose.prod.yml — Grand Lumière (Production)
#
# Dijalankan digabung dengan file base (docker-compose.yml), TANPA docker-compose.override.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Karena docker-compose.yml (base) TIDAK punya bind mount source code
# maupun port 3306 terbuka, file ini tidak perlu "mengosongkan" apapun —
# cukup menambahkan hal-hal yang memang dibutuhkan production.

services:
  php:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  mysql:
    restart: unless-stopped

volumes:
  nginx_logs:
  certbot_www:
  certbot_certs:/etc/letsencrypt: