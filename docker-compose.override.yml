# docker-compose.override.yml
#
# File ini OTOMATIS ikut dibaca kalau kamu jalankan "docker compose up"
# tanpa flag -f apapun. Cocok untuk development di laptop/VM lokal.
#
# JANGAN dipakai di production — saat deploy production, jalankan compose
# dengan -f eksplisit (lihat docker-compose.prod.yml) supaya file ini TIDAK ikut terbaca.

services:
  php:
    volumes:
      - .:/app

  nginx:
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  mysql:
    ports:
      - "3306:3306"